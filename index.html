<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Desktop Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <style>
    :root { --topbar-h: 38px; --pad: 8px; --max-w: 1920px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans";
      background: #f6f7f9; color: #111; overflow: hidden;
    }

    .topbar {
      position: fixed; inset: 0 0 auto 0; height: var(--topbar-h);
      padding: 4px 4px;
      background: #eef0f3;
      border-bottom: 1px solid #d6d9de; z-index: 10;
      display: grid; grid-auto-flow: column; align-items: center; gap: 6px;
    }
    .spacer { height: var(--topbar-h); }

    button, label { font: inherit; }
    button {
      height: 28px; padding: 0 10px;
      border: 1px solid #c9ced6; background: #fff; color:#111;
      border-radius: 8px; cursor: pointer;
      display: grid; place-items: center; white-space: nowrap;
    }
    button[disabled] { background: #eee; color: #999; border-color: #ddd; cursor: not-allowed; }

    .btn-primary { background: #2563eb; border-color: #1d4ed8; color: #fff; }
    .btn-primary:hover { filter: brightness(0.97); }

    #run.running { background: #3b82f6; color: #fff; border-color: #2563eb; cursor: progress; }
    #run.live    { background: #16a34a; color: #fff; border-color: #15803d; }
    #run.error   { background: #dc2626; color: #fff; border-color: #b91c1c; }

    .chk { display: grid; grid-auto-flow: column; align-items: center; gap: 6px; white-space: nowrap; }
    .chk input { transform: translateY(1px); }

    .grow { width: 1px; margin-left: auto; }

    .counter { display: grid; font-size: 12px; line-height: 1.15; color: #6b7280; gap: 0; }

    .popover-wrap { position: relative; }
    .popover { position: absolute; top: 36px; right: 0; width: min(420px, 90vw); max-height: 60vh; overflow: auto; background: #fff; border: 1px solid #c9ced6; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.08); padding: 10px; z-index: 30; }
    .popover-head { display: grid; grid-auto-flow: column; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; font-size: 13px; }
    .log-list { display: grid; gap: 8px; font-size: 12px; }
    .log-item { border: 1px solid #d6d9de; border-radius: 8px; padding: 8px; background: #f9fafb; display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; }
    .log-meta { font-weight: 600; color: #334155; }
    .log-preview { color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-actions { display: grid; justify-content: end; margin-top: 8px; }
    .log-empty { color: #94a3b8; font-style: italic; padding: 4px; }
    .btn-secondary { background: #fff; border: 1px solid #c9ced6; color: #111; }
    .log-btns { display: grid; grid-auto-flow: column; gap: 6px; }
    .log-btns button { width: 28px; height: 28px; padding: 0; font-size: 14px; }

    .wrap { height: calc(100% - var(--topbar-h)); display: grid; grid-template-rows: auto 1fr; }
    .editor-wrap { padding: var(--pad); }
    .editor-wrap.collapsed { display: none; }

    textarea {
      width: 100%; height: 26vh; resize: vertical; padding: 10px;
      border: 1px solid #d6d9de; border-radius: 8px; background: #fff;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      tab-size: 2; white-space: pre; overscroll-behavior: contain;
    }

    .stage { padding: 0 var(--pad) var(--pad); width: 100%; height: 100%; overflow: auto; display: grid; }
    .desk {
      width: 100%; max-width: var(--max-w); margin: 0 auto;
      background: #fff; border: 1px solid #ccd2da; border-radius: 8px; overflow: hidden;
      position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.06);
      height: 480px;
    }
    .desk > iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

    .toast {
      position: fixed; top: calc(var(--topbar-h) + 8px); left: 50%; transform: translateX(-50%);
      background: rgba(33, 37, 41, 0.92); color: #fff; padding: 6px 10px;
      border-radius: 8px; font-size: 12px; z-index: 20; opacity: 0; pointer-events: none;
      transition: opacity .15s ease;
    }
    .toast.show { opacity: 1; }

    #toggleEditorIcon { width: 28px; padding: 0; font-size: 16px; line-height: 1; }

    @media (max-width: 420px) {
      .topbar { gap: 4px; }
      button { padding: 0 8px; }
      .chk { gap: 4px; }
      .counter { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="topbar" id="topbar">
    <button id="toggleEditorIcon" title="Скрыть редактор">🔽</button>
    <div class="counter" id="meter">
      <div id="charCount">Символов: 0</div>
      <div id="lineCount">Строк: 0</div>
    </div>
    <button id="paste">Вставить</button>
    <button id="run" disabled>Запустить</button>
    <button id="clear">Очистить</button>
    <label class="chk" title="Убрать ненужный текст до и после содержимого HTML-страницы">
      <input type="checkbox" id="sanitize" checked> очистить лишний текст
    </label>
    <button id="toggleEditor" class="btn-primary">Скрыть редактор</button>
    <div class="grow"></div>
    <div class="popover-wrap" id="logWrap">
      <button id="logBtn">Лог</button>
      <div class="popover" id="logPopover" hidden>
        <div class="popover-head">
          <span>Вести лог</span>
          <label class="chk">
            <input type="checkbox" id="logToggle">
            <span>вкл</span>
          </label>
        </div>
        <div class="log-list" id="logList"></div>
        <div class="log-actions">
          <button id="clearLog" class="btn-secondary">Очистить лог</button>
        </div>
      </div>
    </div>
    <button id="export">Сохранить HTML</button>
  </div>
  <div class="spacer"></div>

  <div class="wrap">
    <div class="editor-wrap" id="editorWrap">
      <textarea id="code" placeholder="Вставьте HTML/JS/CSS. Можно вставлять сообщение целиком — очистка удалит лишний текст до/после HTML."></textarea>
    </div>

    <div class="stage">
      <div class="desk" id="desk">
        <iframe id="view"
          sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-downloads allow-same-origin">
        </iframe>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  (function () {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();

    function init() {
      const codeEl = document.getElementById('code');
      const pasteBtn = document.getElementById('paste');
      const runBtn = document.getElementById('run');
      const clearBtn = document.getElementById('clear');
      const exportBtn = document.getElementById('export');
      const sanitizeEl = document.getElementById('sanitize');
      const toggleEditorBtn = document.getElementById('toggleEditor');
      const toggleEditorIcon = document.getElementById('toggleEditorIcon');
      const editorWrap = document.getElementById('editorWrap');
      const desk = document.getElementById('desk');
      const toast = document.getElementById('toast');
      const charCountEl = document.getElementById('charCount');
      const lineCountEl = document.getElementById('lineCount');
      const logBtn = document.getElementById('logBtn');
      const logPopover = document.getElementById('logPopover');
      const logToggle = document.getElementById('logToggle');
      const logList = document.getElementById('logList');
      const clearLogBtn = document.getElementById('clearLog');
      const logWrap = document.getElementById('logWrap');
      let iframe = document.getElementById('view');
      let outsideLogHandler = null;

      let timer;
      let lastRunSource = '';
      const LOG_ENABLED_KEY = 'mdr.log.enabled';
      const LOG_STORE_KEY = 'mdr.log.entries';
      const LOG_LIMIT = 30;

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 900);
      }

      function layout() {
        const topbarH = document.getElementById('topbar').offsetHeight;
        const editorH = editorWrap.offsetParent ? editorWrap.offsetHeight : 0;
        const avail = window.innerHeight - topbarH - editorH - 8;
        desk.style.height = Math.max(240, avail) + 'px';
      }
      window.addEventListener('resize', layout);

      function updateRunState() {
        runBtn.disabled = !codeEl.value.trim();
        updateCounters();
      }

      function updateCounters() {
        const val = codeEl.value || '';
        charCountEl.textContent = `Символов: ${val.length}`;
        const lines = val ? val.split(/\r\n|\r|\n/).length : 0;
        lineCountEl.textContent = `Строк: ${lines}`;
      }

      function markRunning() {
        runBtn.classList.add('running');
        runBtn.textContent = 'Запуск...';
        runBtn.disabled = true;
      }
      function markLive() {
        runBtn.classList.remove('running', 'error');
        runBtn.classList.add('live');
        runBtn.textContent = 'Перезапустить';
        runBtn.disabled = false;
      }
      function markError() {
        runBtn.classList.remove('running', 'live');
        runBtn.classList.add('error');
        runBtn.textContent = 'Ошибка';
        runBtn.disabled = false;
      }

      function isEditorVisible() {
        return !editorWrap.classList.contains('collapsed');
      }
      function setEditorState(show) {
        editorWrap.classList.toggle('collapsed', !show);
        toggleEditorBtn.textContent = show ? 'Скрыть редактор' : 'Показать редактор';
        toggleEditorIcon.textContent = show ? '🔽' : '🔼';
        toggleEditorIcon.title = show ? 'Скрыть редактор' : 'Показать редактор';
        layout();
      }

      function loadLogEnabled() {
        return localStorage.getItem(LOG_ENABLED_KEY) === '1';
      }

      function saveLogEnabled(on) {
        localStorage.setItem(LOG_ENABLED_KEY, on ? '1' : '0');
      }

      function loadLogEntries() {
        try {
          const raw = localStorage.getItem(LOG_STORE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        } catch {}
        return [];
      }

      function saveLogEntries(items) {
        localStorage.setItem(LOG_STORE_KEY, JSON.stringify(items));
      }

      function addLogEntry(code) {
        if (!logToggle.checked) return;
        const items = loadLogEntries();
        const ts = new Date();
        items.unshift({ id: ts.getTime(), ts: ts.toISOString(), code });
        if (items.length > LOG_LIMIT) items.length = LOG_LIMIT;
        saveLogEntries(items);
        renderLog();
      }

      function removeLogEntry(id) {
        const filtered = loadLogEntries().filter((i) => i.id !== id);
        saveLogEntries(filtered);
        renderLog();
      }

      function clearLog() {
        saveLogEntries([]);
        renderLog();
      }

      function closeLogPopover() {
        if (logPopover.hasAttribute('hidden')) return;
        logPopover.setAttribute('hidden', '');
        if (outsideLogHandler) {
          document.removeEventListener('mousedown', outsideLogHandler);
          outsideLogHandler = null;
        }
      }

      function openLogPopover() {
        if (!logPopover.hasAttribute('hidden')) return;
        renderLog();
        logPopover.removeAttribute('hidden');
        if (!outsideLogHandler) {
          outsideLogHandler = (e) => {
            if (!logPopover.contains(e.target) && !logBtn.contains(e.target)) {
              closeLogPopover();
            }
          };
          document.addEventListener('mousedown', outsideLogHandler);
        }
      }

      function renderLog() {
        const items = loadLogEntries();
        logList.innerHTML = '';
        if (!logToggle.checked) {
          logList.innerHTML = '<div class="log-empty">Лог выключен</div>';
          return;
        }
        if (!items.length) {
          logList.innerHTML = '<div class="log-empty">Пока нет записей</div>';
          return;
        }
        const frag = document.createDocumentFragment();
        items.forEach((item) => {
          const row = document.createElement('div');
          row.className = 'log-item';
          const meta = document.createElement('div');
          meta.className = 'log-meta';
          const date = new Date(item.ts);
          meta.textContent = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
          const preview = document.createElement('div');
          preview.className = 'log-preview';
          const clip = item.code.replace(/\s+/g, ' ').trim();
          preview.textContent = clip.length > 180 ? clip.slice(0, 180) + '…' : clip || '—';
          const btns = document.createElement('div');
          btns.className = 'log-btns';

          const restore = document.createElement('button');
          restore.title = 'Восстановить код';
          restore.textContent = '↩';
          restore.addEventListener('click', () => {
            codeEl.value = item.code;
            updateRunState();
            setEditorState(true);
          });

          const del = document.createElement('button');
          del.title = 'Удалить запись';
          del.textContent = '✖';
          del.style.color = '#b91c1c';
          del.addEventListener('click', () => removeLogEntry(item.id));

          btns.append(restore, del);
          row.append(meta, preview, btns);
          frag.append(row);
        });
        logList.append(frag);
      }

      codeEl.addEventListener('input', updateRunState);
      toggleEditorBtn.addEventListener('click', () => setEditorState(!isEditorVisible()));
      toggleEditorIcon.addEventListener('click', () => setEditorState(!isEditorVisible()));

      pasteBtn.addEventListener('click', async () => {
        let inserted = null;
        try {
          if (navigator.clipboard?.readText) inserted = await navigator.clipboard.readText();
        } catch {}
        if (!inserted) inserted = prompt('Вставьте текст вручную:') || '';
        const cleaned = sanitizeEl.checked ? extractHtml(inserted) : stripBOM(inserted).trim();
        codeEl.value = cleaned;
        updateRunState();
        showToast('Вставлено');
        setEditorState(false);
        const doc = wrapDocument(cleaned);
        executeCode(doc, cleaned);
      });

      clearBtn.addEventListener('click', () => {
        codeEl.value = '';
        updateRunState();
        resetIframe();
        showToast('Очищено');
        setEditorState(true);
      });

      runBtn.addEventListener('click', () => {
        if (runBtn.disabled) return;
        const raw = codeEl.value;
        const cleaned = sanitizeEl.checked ? extractHtml(raw) : stripBOM(raw).trim();
        if (isEditorVisible()) setEditorState(false);
        const doc = wrapDocument(cleaned);
        executeCode(doc, cleaned);
      });

      exportBtn.addEventListener('click', () => {
        const raw = codeEl.value;
        if (!raw.trim()) { showToast('Нет данных для сохранения'); return; }
        const cleaned = sanitizeEl.checked ? extractHtml(raw) : stripBOM(raw).trim();
        const doc = wrapDocument(cleaned);
        downloadHtml(doc);
      });

      logBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (logPopover.hasAttribute('hidden')) openLogPopover();
        else closeLogPopover();
      });

      logToggle.addEventListener('change', () => {
        saveLogEnabled(logToggle.checked);
        renderLog();
      });

      clearLogBtn.addEventListener('click', () => clearLog());

      function executeCode(doc, sourceForLog = '') {
        lastRunSource = sourceForLog;
        markRunning();
        resetIframe();
        const fresh = document.createElement('iframe');
        fresh.id = 'view';
        fresh.setAttribute('sandbox',
          'allow-scripts allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-downloads allow-same-origin');
        fresh.srcdoc = doc;
        desk.replaceChild(fresh, iframe);
        iframe = fresh;

        clearTimeout(timer);
        timer = setTimeout(() => markError(), 5000);
        iframe.onload = () => { clearTimeout(timer); markLive(); showToast('Запущено'); addLogEntry(lastRunSource); };
        iframe.onerror = () => { clearTimeout(timer); markError(); };
      }

      function resetIframe() {
        const blank = document.createElement('iframe');
        blank.id = 'view';
        blank.setAttribute('sandbox',
          'allow-scripts allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-downloads allow-same-origin');
        blank.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>';
        desk.replaceChild(blank, iframe);
        iframe = blank;
      }

      // Удаление BOM/ZWSP в начале
      function stripBOM(t) {
        return (t || '').replace(/^\uFEFF/, '').replace(/^\u200B+/, '');
      }

      // Аккуратная вырезка HTML из «сообщения целиком»
      function extractHtml(text) {
        let t = stripBOM(text || '');
        const fence = /```(?:html?|HTML?)?\s*([\s\S]*?)```/;
        const mFence = t.match(fence);
        if (mFence) t = mFence[1];

        const low = t.toLowerCase();
        const iDoctype = low.indexOf('<!doctype');
        const iHtml = low.indexOf('<html');
        let start = -1;
        if (iDoctype >= 0 && iHtml >= 0) start = Math.min(iDoctype, iHtml);
        else start = (iDoctype >= 0) ? iDoctype : iHtml;
        if (start >= 0) {
          t = t.slice(start);
          const endTag = t.toLowerCase().lastIndexOf('</html>');
          if (endTag >= 0) t = t.slice(0, endTag + 7);
          return t.trim();
        }
        return t.trim();
      }

      // Гарантируем <meta charset> и viewport в <head>
      function wrapDocument(src) {
        let s = stripBOM(src || '');
        const hasHtml = /<\s*html[\s>]/i.test(s);
        const hasHead = /<\s*head[\s>]/i.test(s);
        const hasCharset = /<meta\s+charset=["']?utf-8["']?\s*>/i.test(s);
        const hasViewport = /<meta[^>]+name=["']viewport["'][^>]*>/i.test(s);
        const charset = `<meta charset="utf-8">`;
        const viewport = `<meta name="viewport" content="width=device-width, initial-scale=1">`;

        if (hasHtml) {
          if (hasHead) {
            // Вставляем недостающие мета в начало <head>
            s = s.replace(/<\s*head(\s[^>]*)?>/i, (m) => {
              let inject = '';
              if (!hasCharset) inject += charset;
              if (!hasViewport) inject += viewport;
              return m + inject;
            });
            return s;
          }
          // Есть <html>, но нет <head>
          return s.replace(/<\s*html([^>]*)>/i, (m, attrs) =>
            `<html${attrs}><head>${charset}${viewport}</head>`
          );
        }
        // Фрагмент — оборачиваем в полноценный документ
        return `<!doctype html><html><head>${charset}${viewport}</head><body>${s}</body></html>`;
      }

      function downloadHtml(doc) {
        const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'page.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showToast('HTML сохранён');
      }

      logToggle.checked = loadLogEnabled();
      renderLog();

      updateRunState();
      layout();
      setEditorState(true);
    }
  })();
  </script>
</body>
</html>
